backend: igraph
default_cost: travel_time
network_type: driving
retain_all_components: true
simplify: false
speed_model:
  # Estimated free-flow km/h, capped by numeric posted maxspeed when available.
  # Research assumptions, not a statement of national legal limits.
  class_kph:
    motorway: 110
    motorway_link: 50
    trunk: 90
    trunk_link: 45
    primary: 70
    primary_link: 40
    secondary: 60
    secondary_link: 35
    tertiary: 50
    tertiary_link: 30
    unclassified: 40
    residential: 30
    living_street: 10
    service: 15
    road: 20
  symbolic_maxspeed_kph:
    SI:urban: 50
    SI:rural: 90
    SI:motorway: 130
    SI:trunk: 110
    walk: 5
  mph_to_kph: 1.609344
  min_kph: 1
  max_kph: 140
access:
  # Explicit non-passenger-car classes found in the parser's exclusion-based filter.
  excluded_highway: [busway, bus_guideway, escape, rest_area, services, via_ferrata, bus_stop, emergency_bay, ladder]
  hierarchy: [motorcar, motor_vehicle, vehicle, access]
  allowed: [yes, permissive, designated, official]
  # Destination-only roads cannot be unrestricted through edges.
  excluded: [no, private, destination, delivery, customers, agricultural, forestry]
  exclude_conditional_access: true
  exclude_conditional_oneway: true
instances:
  seed: 20260930
  per_band: 10
  bands_km: [[50, 100], [100, 200], [200, 400]]
  max_attempts: 3000
  jitter_km: 2
  max_snap_m: 3000
