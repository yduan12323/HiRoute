name: M5 drift fixture and collector verification ONLY
run-name: Deterministic drift fix verification — no original-process retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-fix-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Deterministic admission and collector regressions only
        run: python ci/run_m5_drift_diagnostic.py --verification-only
      - name: Retain bounded verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m5-drift-fix-verification
          path: ${{ runner.temp }}/m5-drift-fix-verification/
          retention-days: 30
          if-no-files-found: error
