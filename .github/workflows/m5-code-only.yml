name: M5 drift diagnostic ONLY
run-name: One original optimized drift diagnostic — not full M5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-single-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Deterministic admission and one unchanged original process test
        run: python ci/run_m5_drift_diagnostic.py
      - name: Retain all original receipts even if the original assertion fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m5-drift-single-diagnostic
          path: ${{ runner.temp }}/m5-drift-diagnostic/
          retention-days: 30
          if-no-files-found: error
