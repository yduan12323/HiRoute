name: Exact leg input contracts
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Historical source revision to investigate in isolation
        required: true
        default: '679239d'

permissions:
  contents: read
concurrency:
  group: exact-leg-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  input-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Exact input fixtures in a clean pinned environment
        run: python ci/run_exact_leg_input_code.py
      - name: Preserve all command slots and budget receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-leg-input-code
          path: |
            ${{ runner.temp }}/exact-leg-input-code/accounting.json
            ${{ runner.temp }}/exact-leg-input-code/started.json
          retention-days: 30
          if-no-files-found: error
