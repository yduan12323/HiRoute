[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiroute"
version = "0.2.0"
description = "HiRoute explicit problem contracts and portable core interface"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
hiroute = "hiroute.cli:main"

[tool.setuptools]
packages = ["hiroute", "hiroute.exact"]
package-dir = {"" = "src"}
