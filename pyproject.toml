[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiroute"
version = "0.1.0"
description = "Frozen OSM road graph infrastructure for HiRoute research"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "geopandas", "shapely", "pyproj", "pyrosm", "igraph", "pyyaml"]

[tool.setuptools]
packages = ["graph", "envelope", "opportunity", "microplan", "stopplan4r", "hierarchy4r", "timecut5"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires frozen processed Slovenia data"]

[tool.setuptools.package-data]
opportunity = ["*.cpp"]
microplan = ["*.cpp"]
