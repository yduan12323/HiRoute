[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiroute-compare"
version = "0.2.0"
description = "Independent exact physical model and sealed-candidate verification"
requires-python = ">=3.11,<3.12"
dependencies = ["z3-solver==4.13.4.0", "psutil==7.2.2"]

[project.scripts]
hiroute-compare = "hiroute_compare.cli:main"

[tool.setuptools]
packages = ["hiroute_compare"]
package-dir = {"" = "src"}
